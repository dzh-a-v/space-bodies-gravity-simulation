name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GravitySim-windows-x64

          - os: ubuntu-22.04
            artifact: GravitySim-linux-x64

          - os: macos-15
            artifact: GravitySim-macos-arm64

          - os: macos-15-intel
            artifact: GravitySim-macos-x64

    defaults:
      run:
        working-directory: program

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: program/pyproject.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a pytest

      - name: Run tests on Windows and macOS
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

      - name: Build app with PyInstaller on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a pyinstaller --noconfirm --clean --onedir --windowed --name GravitySim --collect-data gravity_sim --collect-all PySide6 --collect-all pyqtgraph src/gravity_sim/main.py

      - name: Build app with PyInstaller on Windows and macOS
        if: runner.os != 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name GravitySim --collect-data gravity_sim --collect-all PySide6 --collect-all pyqtgraph src/gravity_sim/main.py

      - name: Package app
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil

          name = os.environ["ARTIFACT_NAME"]
          dist = pathlib.Path("dist")

          mac_app = dist / "GravitySim.app"
          app_folder = mac_app if mac_app.exists() else dist / "GravitySim"

          if not app_folder.exists():
              raise SystemExit(f"Build output not found: {app_folder}")

          shutil.make_archive(name, "zip", root_dir=app_folder.parent, base_dir=app_folder.name)
          print(f"Created {name}.zip")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: program/${{ matrix.artifact }}.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/*.zip --title "$TAG" --generate-notes